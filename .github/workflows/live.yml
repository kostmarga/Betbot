# BetBot LIVE – ανανεώνει τη σελίδα docs/live.html με την πορεία των δελτίων (κάθε 10 λεπτά).
# Ώρες σε UTC. Ελλάδα = UTC+2 (χειμώνας) / UTC+3 (καλοκαίρι).
#   Καθημερινά 14:00–21:50 UTC  = 16:00–23:50 Ελλάδας (χειμώνας)
#   Σαβ/Κυρ ακόμα 11:00–13:50 UTC = 13:00–15:50 Ελλάδας (πρωινά ματς)
# ΚΟΣΤΟΣ: κάθε εκτέλεση χρεώνεται ~1 λεπτό. Σε private repo το όριο είναι 2.000 λεπτά/μήνα
#   (≈1.440 για καθημερινά + ≈140 για Σαβ/Κυρ + η καθημερινή εκτέλεση). Αν περνάει το όριο:
#   μίκρυνε τις ώρες ή βάλε "*/15". Σε public repo δεν υπάρχει όριο.
# Διαβάζει τη βάση από το branch data (δεν τη γράφει) και κάνει commit ΜΟΝΟ το docs/live.html.
# ΕΠΙΠΛΕΟΝ «φύλακας»: το GitHub καθυστερεί/χάνει τα προγραμματισμένα τρεξίματα του «BetBot daily». Αυτό το workflow τρέχει συχνά
# (και το πρωί, 04:00–10:59 UTC κάθε 20'), οπότε σε κάθε εκτέλεση ρωτά «έτρεξε σήμερα το daily;» (betbot/freshness.py)
# και, αν όχι, το ξεκινά με workflow_dispatch (όχι πιο συχνά από μία φορά ανά 45'). Αρκεί να τρέξει ΕΝΑ από τα πολλά.
name: BetBot live

on:
  schedule:
    - cron: "*/10 14-21 * * *"
    - cron: "*/10 11-13 * * 0,6"
    - cron: "*/20 4-10 * * *"      # πρωινός φύλακας: ξεκινά το daily αν δεν έχει τρέξει
    - cron: "*/20 22-23,0-3 * * *" # νυχτερινός φύλακας (ματς NBA τελειώνουν τα ξημερώματα): ξεκινά το daily αν εκκρεμούν αποτελέσματα
    - cron: "*/20 11-13 * * 1-5"   # μεσημεριανός φύλακας Δευ–Παρ
  workflow_dispatch:
    inputs:
      force_daily:
        description: "Δοκιμή: ξεκίνα το BetBot daily ανεξάρτητα από το αν η σελίδα είναι ξεπερασμένη"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write                   # για να ξεκινά το «BetBot daily» (workflow_dispatch)

concurrency:
  group: betbot-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Φύλακας – έτρεξε σήμερα το «BetBot daily»; Αν όχι, ξεκίνα το
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force_daily }}
        run: |
          if [ "$FORCE" != "true" ] && python -m betbot.freshness docs/last_run.json; then exit 0; fi
          last=$(gh run list --workflow daily.yml --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          age=999999
          if [ -n "$last" ]; then age=$(( $(date +%s) - $(date -d "$last" +%s) )); fi
          if [ "$age" -gt 2700 ]; then
            echo "Ξεκινά το BetBot daily (τελευταίο run πριν από $age δευτερόλεπτα)"
            gh workflow run daily.yml --ref main
          else
            echo "Το BetBot daily ξεκίνησε πρόσφατα ($age δευτερόλεπτα πριν) – δεν το ξαναξεκινάμε"
          fi

      - run: pip install -r requirements.txt

      - name: Φόρτωση βάσης (branch data)
        run: |
          # Η βάση ζει στο branch "data" (1 commit που ξαναγράφεται) ώστε το repo να μη φουσκώνει.
          # Πρώτη φορά: χρησιμοποιείται η αρχική βάση που υπάρχει στο main.
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:data/betbot.sqlite > data/betbot.sqlite
          else
            echo "Δεν υπάρχει ακόμα branch data – χρήση της αρχικής βάσης"
          fi
          git update-index --skip-worktree data/betbot.sqlite   # να μην μπλέκει στα commit/pull του main

      - name: Live σελίδα
        run: python main.py --live

      - name: Αποθήκευση docs/live.html
        run: |
          git config user.name "betbot"
          git config user.email "betbot@users.noreply.github.com"
          git add docs/live.html
          git diff --cached --quiet && { echo "Καμία αλλαγή"; exit 0; }
          git commit -m "Live $(date -u +%H:%M)Z"
          for i in 1 2 3; do
            git fetch -q origin main
            if git rebase -q -X theirs origin/main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done
          echo "Push απέτυχε"
