# BetBot odds – αποθηκεύει στο repo (docs/odds_user.json) την απόδοση που καταχώρισε ο χρήστης στη σελίδα για ένα δελτίο
# χωρίς απόδοση πρακτορείου, ώστε να φαίνεται από κάθε συσκευή. Ξεκινά από τη σελίδα (workflow_dispatch) με κλειδί GitHub που
# ο χρήστης βάζει ΜΟΝΟ στον browser του (ποτέ στον κώδικα). Οι τιμές επικυρώνονται· τίποτα δεν εκτελείται από την είσοδο.
name: BetBot odds
on:
  workflow_dispatch:
    inputs:
      id:
        description: "slip_id, π.χ. 2026-11-14#fair_corners"
        required: true
      odds:
        description: "απόδοση (κενό = διαγραφή)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: betbot-odds
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ενημέρωση docs/odds_user.json
        env:
          SLIP_ID: ${{ inputs.id }}
          ODDS: ${{ inputs.odds }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          sid, odds = os.environ["SLIP_ID"], (os.environ.get("ODDS") or "").strip().replace(",", ".")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}#fair_[a-z_]+(~[sb])?", sid):
              sys.exit("μη έγκυρο slip_id")
          p = "docs/odds_user.json"
          try:
              d = json.load(open(p, encoding="utf-8"))
          except Exception:
              d = {}
          if odds == "":
              d.pop(sid, None)
          else:
              v = float(odds)
              if not (1.01 <= v <= 1000):
                  sys.exit("μη έγκυρη απόδοση")
              d[sid] = round(v, 2)
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=0, sort_keys=True)
          PY
      - name: Commit
        run: |
          git config user.name "betbot"
          git config user.email "betbot@users.noreply.github.com"
          git add docs/odds_user.json
          git diff --cached --quiet && { echo "Καμία αλλαγή"; exit 0; }
          git commit -m "Απόδοση χρήστη"
          for i in 1 2 3 4; do
            git fetch -q origin main
            if git rebase -q -X theirs origin/main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done
          echo "Push απέτυχε"; exit 1
