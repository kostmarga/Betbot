# Δοκιμαστικό (workflow_dispatch): ελέγχει από το GitHub Actions ποιες πηγές απαντούν. Δεν αλλάζει τίποτα στο repo.
# Το κλειδί APIFOOTBALL_KEY διαβάζεται από τα secrets και ΔΕΝ τυπώνεται.
name: Probe sources
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
    steps:
      - name: API-Football
        run: |
          if [ -z "$APIFOOTBALL_KEY" ]; then echo "ΔΕΝ υπάρχει APIFOOTBALL_KEY στα secrets"; exit 0; fi
          H="x-apisports-key: $APIFOOTBALL_KEY"
          B="https://v3.football.api-sports.io"
          show() { python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print('errors:',d.get('errors'),'| results:',d.get('results'),'| paging:',d.get('paging'))
          r=d.get('response')
          if isinstance(r,dict): print('response:',json.dumps(r,ensure_ascii=False)[:600])
          elif r: print('first:',json.dumps(r[0],ensure_ascii=False)[:700])
          "; }
          echo "== status"; curl -sS -m 20 -H "$H" "$B/status" | show
          D=$(date -u +%F)
          echo "== injuries date=$D"; curl -sS -m 20 -H "$H" "$B/injuries?date=$D" | show
          T=$(date -u -d "+1 day" +%F)
          echo "== injuries date=$T"; curl -sS -m 20 -H "$H" "$B/injuries?date=$T" | show
          echo "== topscorers EPL 2026"; curl -sS -m 20 -H "$H" "$B/players/topscorers?league=39&season=2026" | show
          echo "== topscorers EPL 2025"; curl -sS -m 20 -H "$H" "$B/players/topscorers?league=39&season=2025" | show
          echo "== fixtures EPL date=$T (2026)"; curl -sS -m 20 -H "$H" "$B/fixtures?league=39&season=2026&date=$T" | show
