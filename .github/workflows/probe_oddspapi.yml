# ΠΡΟΣΩΡΙΝΟ τεστ τένις (17/11/2026). Θα διαγραφεί μετά το τεστ.
name: Probe OddsPapi tennis
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Τεστ τένις
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python tools/probe_oddspapi.py
