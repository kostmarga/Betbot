# ==========================================================
#  BetBot – ρυθμίσεις
#  Άλλαξε τιμές εδώ. Δεν χρειάζεται να πειράξεις κώδικα.
# ==========================================================

timezone: Europe/Athens
database: data/betbot.sqlite
reports_dir: docs            # εδώ γράφεται το index.html (GitHub Pages)

# ---------- Δελτίο ----------
slip:
  target_odds: 20.0          # στόχος συνολικής απόδοσης
  min_total_odds: 17.0       # αποδεκτό εύρος γύρω από τον στόχο
  max_total_odds: 25.0
  min_legs: 4
  max_legs: 8
  alternatives: 2            # πόσα εναλλακτικά δελτία εκτός από το κύριο
  stake: 2.0                 # ποντάρισμα ανά δελτίο (μόνο για το ιστορικό Κ/Ζ)
  hours_ahead: 30            # αγώνες που ξεκινούν μέσα στις επόμενες Χ ώρες

# ---------- Φίλτρα επιλογών ----------
selection:
  min_model_prob: 0.55       # ελάχιστη πιθανότητα (μετά το blend με την αγορά)
  min_edge: -0.10            # ελάχιστο value: p*απόδοση - 1. Με πιθανότητες από την αγορά το value = −προμήθεια (~−3…−7%), γι' αυτό −0.10
  min_odds: 1.15             # κάτω από αυτό δεν αξίζει ούτε για δέσιμο
  max_odds: 2.10             # (παλιό, για συμβατότητα)
  max_odds_any: 3.00         # μέγιστη απόδοση μίας επιλογής (backtest: οι υψηλές αποδόσεις χάνουν πολύ περισσότερο· 6+ ≈ −21%)
  fair_min_prob: 0.55        # επιλογές ΧΩΡΙΣ απόδοση: ελάχιστη πιθανότητα για να εμφανιστούν
  fair_min_odds: 1.30        # ... και δίκαιη απόδοση τουλάχιστον 1.30 (αλλιώς δεν αξίζει: π.χ. «Under 12.5 κόρνερ»)
  fair_value_margin: 0.05    # «παίξ' το αν ≥» = δίκαιη απόδοση × 1.05
  market_blend: 0.0          # 0 = μόνο αγορά, 1 = μόνο μοντέλο. Μπάσκετ: δεν έχει backtest, αλλά το μοντέλο ποδοσφαίρου έχασε από την αγορά και με τα πάντα βάρη -> ίδια προσοχή
  market_blend_football: 0.0 # ποδόσφαιρο: backtest 13 μηνών -> όσο περισσότερο βάρος στο μοντέλο, τόσο χειρότερα
  avoid:                     # επιλογές που έχασαν σταθερά και στις δύο μισές του backtest
    - {sport: football, market: OU, selection: UNDER, line: 2.5}   # ROI −7% (Over: ~−1%)
  max_legs_per_league: 3     # διασπορά κινδύνου
  min_team_matches: 8        # ομάδα με λιγότερα ματς στο ιστορικό -> αγνοείται

# ---------- Μοντέλα ----------
models:
  football:
    history_days: 540        # πόσο πίσω στο ιστορικό
    half_life_days: 180      # πόσο γρήγορα «ξεχνάει» παλιά ματς
    dc_rho: -0.08            # διόρθωση Dixon-Coles για 0-0 / 1-1
    h2h_weight_max: 0.15     # μέγιστη επιρροή αναμετρήσεων μεταξύ τους
    markets: [1X2, OU15, OU25, OU35, BTTS]
  basketball:
    history_days: 400
    half_life_days: 90
    markets: [ML, TOTAL, SPREAD]
  counts:                    # κόρνερ / κάρτες / πλάγια
    history_days: 400
    half_life_days: 120
    shrink_games: 16         # πόσο «τραβάμε» προς τον μέσο όρο ομάδες με λίγα ματς (backtest 06/11/2026: 4 → 16 βελτιώνει κάρτες 0.0154→0.0206 και κόρνερ 0.0005→0.0065)
    referee_shrink_games: 24
  players:
    player_last_n: 10        # τελευταία Ν ματς παίκτη
    player_min_games: 5

# ---------- Διοργανώσεις ----------
# espn: κωδικός ESPN · fdco: κωδικός football-data.co.uk · odds_api: κλειδί The Odds API
# sofascore: id διοργάνωσης στο Sofascore (uniqueTournament). Αν κάποιο είναι λάθος, ο collector
#            ταιριάζει και με το όνομα της διοργάνωσης (βλ. README §6).
leagues:
  - {id: EPL,  name: Premier League,    sport: football,   espn: eng.1, fdco: E0,  sofascore: 17,  odds_api: soccer_epl}
  - {id: LIGA, name: LaLiga,            sport: football,   espn: esp.1, fdco: SP1, sofascore: 8,   odds_api: soccer_spain_la_liga}
  - {id: SA,   name: Serie A,           sport: football,   espn: ita.1, fdco: I1,  sofascore: 23,  odds_api: soccer_italy_serie_a}
  - {id: BL,   name: Bundesliga,        sport: football,   espn: ger.1, fdco: D1,  sofascore: 35,  odds_api: soccer_germany_bundesliga}
  - {id: L1,   name: Ligue 1,           sport: football,   espn: fra.1, fdco: F1,  sofascore: 34,  odds_api: soccer_france_ligue_one}
  - {id: GSL,  name: Super League,      sport: football,   espn: gre.1, fdco: G1,  sofascore: 185, odds_api: soccer_greece_super_league}
  # Επιπλέον λίγκες (06/11/2026) – έχουν ESPN (αγώνες/κόρνερ/κάρτες) + football-data (αποδόσεις στο fixtures.csv)
  - {id: EFL1, name: Championship,      sport: football,   espn: eng.2, fdco: E1,  odds_api: soccer_efl_champ}
  - {id: EFL2, name: League One,        sport: football,   espn: eng.3, fdco: E2,  odds_api: soccer_england_league1}
  - {id: EFL3, name: League Two,        sport: football,   espn: eng.4, fdco: E3,  odds_api: soccer_england_league2}
  - {id: SCO,  name: Scottish Premiership, sport: football, espn: sco.1, fdco: SC0, odds_api: soccer_spl}
  - {id: BEL,  name: Jupiler Pro League, sport: football,  espn: bel.1, fdco: B1,  odds_api: soccer_belgium_first_div}
  - {id: NED,  name: Eredivisie,        sport: football,   espn: ned.1, fdco: N1,  odds_api: soccer_netherlands_eredivisie}
  - {id: POR,  name: Primeira Liga,     sport: football,   espn: por.1, fdco: P1,  odds_api: soccer_portugal_primeira_liga}
  - {id: TUR,  name: Süper Lig,         sport: football,   espn: tur.1, fdco: T1,  odds_api: soccer_turkey_super_league}
  - {id: LIGA2, name: LaLiga 2,         sport: football,   espn: esp.2, fdco: SP2, odds_api: soccer_spain_segunda_division}
  - {id: SB,   name: Serie B,           sport: football,   espn: ita.2, fdco: I2,  odds_api: soccer_italy_serie_b}
  - {id: BL2,  name: 2. Bundesliga,     sport: football,   espn: ger.2, fdco: D2,  odds_api: soccer_germany_bundesliga2}
  - {id: L2,   name: Ligue 2,           sport: football,   espn: fra.2, fdco: F2,  odds_api: soccer_france_ligue_two}
  - {id: UCL,  name: UEFA Champions League,  sport: football, espn: uefa.champions,   sofascore: 7,     odds_api: soccer_uefa_champs_league}
  - {id: UEL,  name: UEFA Europa League,      sport: football, espn: uefa.europa,      sofascore: 679,   odds_api: soccer_uefa_europa_league}
  - {id: UECL, name: UEFA Conference League,  sport: football, espn: uefa.europa.conf, sofascore: 17015, odds_api: soccer_uefa_europa_conference_league}
  # --- επιπλέον πρωταθλήματα (ESPN για προγράμματα/αποτελέσματα/αποδόσεις, fdco_new μόνο για backtest 1Χ2) ---
  # Backtest 09/11/2026: κρατήθηκαν όσα έχουν ROI ≥ των κύριων λιγκών. ΕΞΩ (αρνητικό ROI): Αυστρία, Ελβετία, Δανία, Αργεντινή, Ιρλανδία.
  - {id: NOR,  name: Eliteserien,         sport: football, espn: nor.1, fdco_new: NOR}
  - {id: SWE,  name: Allsvenskan,         sport: football, espn: swe.1, fdco_new: SWE}
  - {id: MLS,  name: MLS,                 sport: football, espn: usa.1, fdco_new: USA}
  - {id: BRA,  name: Brasileirão,         sport: football, espn: bra.1, fdco_new: BRA}
  - {id: MEX,  name: Liga MX,             sport: football, espn: mex.1, fdco_new: MEX}
  - {id: JPN,  name: J1 League,           sport: football, espn: jpn.1, fdco_new: JPN}
  - {id: NBA,  name: NBA,               sport: basketball, espn: nba,              odds_api: basketball_nba}
  - {id: EL,   name: Euroleague,        sport: basketball, euroleague: E,          odds_api: basketball_euroleague}
  - {id: GBL,  name: ΕΚΟ Basket League, sport: basketball, greek_site: true}   # μόνο μέσω ελληνικού site (βλ. README)

# ---------- Πηγές (collectors / agents) ----------
collectors:
  espn:            {enabled: true}
  euroleague:      {enabled: true}
  fdco_history:    {enabled: true, seasons_back: 3}   # ιστορικά κόρνερ/κάρτες/φάουλ από προηγούμενες σεζόν
  espn_odds:       {enabled: true, days_ahead: 3, max_calls_per_run: 250}   # δωρεάν αποδόσεις (DraftKings/Bet365) από το ESPN
  fdco_odds:       {enabled: true}      # δωρεάν αποδόσεις top-5 + Super League
  odds_api:
    enabled: true                       # χρειάζεται env ODDS_API_KEY (δωρεάν)
    regions: eu
    markets: [h2h, totals]
    monthly_budget: 480                 # κρατάμε 20 credits περιθώριο από τα 500
    skip_if_fdco_covers: true           # μην ξοδεύεις credits για λίγκες που καλύπτει το fdco
  sofascore:
    enabled: true                       # πλάγια, κόρνερ, κάρτες, παίκτες, ενδεκάδες, απουσίες, αρχικές αποδόσεις
    backfill_days: 60                   # πρώτη εκτέλεση: πόσες μέρες ιστορικό (~1 ώρα)
    daily_lookback_days: 3              # επόμενες εκτελέσεις: μόνο οι τελευταίες μέρες
    max_calls_per_run: 2500             # ασφάλεια: μέγιστες κλήσεις ανά εκτέλεση
  espn_stats:
    enabled: true                       # εφεδρικά στατιστικά (κόρνερ/κάρτες/σουτ) αν το Sofascore μπλοκάρει
    lookback_days: 120
    max_calls_per_run: 400
  greek_site:
    enabled: false                      # ενεργοποιείται αφού ρυθμιστεί (βλ. README §7)
    name: ""
    events_url: ""
    timeout: 20

# ---------- Κανόνες (από τα λάθη μας – βλ. betbot/rules.py) ----------
rules:
  min_ppg_for_win: 1.3           # όχι «νίκη» σε ομάδα με < 1.3 βαθμούς/ματς στα 5 τελευταία
  min_basket_win_rate: 0.4       # μπάσκετ: όχι νίκη σε ομάδα με < 40% νίκες στα 5 τελευταία
  max_absences: 5                # ≥5 απουσίες -> όχι Over/GG/νίκη για αυτή την ομάδα στο Προτεινόμενο
  max_attack_absences: 3         # ή ≥3 απουσίες επιθετικών/μέσων
  basket_min_ml_odds_safe: 1.55  # γηπεδούχος μπάσκετ κάτω από 1.55 δεν θεωρείται «safe»
  max_drift_against: 0.08        # απόδοση που ανέβηκε ≥8% -> έξω από Προτεινόμενο/Safe
  move_show_min: 0.04            # στην καρτέλα Κινήσεις: από 4% και πάνω

# ---------- Λίστες / dashboards ----------
lists:
  # Προτεινόμενο = δελτίο που ΑΞΙΖΕΙ να παίξεις: συνολική απόδοση ~2.0–3.2 (όχι 1.47: με 2€ κερδίζεις 0.94€ και δεν αξίζει),
  # με όσο το δυνατόν μεγαλύτερη πιθανότητα μέσα σε αυτό το εύρος. Αντιστάθμισμα: πιθανότητα ~40–50% (όχι 63%).
  # Η αναμενόμενη ζημιά ανά 1€ είναι παρόμοια (~−3…−8%) – η υψηλότερη απόδοση δεν κάνει το στοίχημα πιο κερδοφόρο.
  recommended: {min_total: 2.00, max_total: 3.20, min_legs: 2, max_legs: 3, min_leg_prob: 0.60,
                max_leg_odds: 1.90, max_basketball_legs: 1, max_basketball_legs_thin: 2, thin_football_matches: 4, single_min_odds: 1.60, single_max_odds: 2.30,
                single_min_prob: 0.55}
  safe:        {count: 10, min_odds: 1.12, min_leg_prob: 0.70, min_total: 1.60, max_total: 2.60, min_legs: 2, max_legs: 4,
                max_basketball_legs: 1}     # Safe ΔΕΛΤΙΟ (ο χρήστης παίζει μόνο δελτία)
  x10:         {min_leg_prob: 0.58, min_total: 9,   max_total: 14,  min_legs: 3, max_legs: 6, max_basketball_legs: 2}
  x30:         {min_leg_prob: 0.55, min_total: 28,  max_total: 45,  min_legs: 4, max_legs: 8}
  x100:        {min_leg_prob: 0.50, min_total: 100, max_total: 250, min_legs: 5, max_legs: 10}
  overs:       {min_leg_prob: 0.55, count: 12, only_over: true, min_total: 8, max_total: 25, min_legs: 3, max_legs: 7}
  corners:     {min_leg_prob: 0.55, count: 12, min_edge: 0.0, min_total: 2.5, max_total: 12, min_legs: 2, max_legs: 4, allow_probable: true}
  cards:       {min_leg_prob: 0.55, count: 12, min_edge: 0.0, min_total: 2.5, max_total: 12, min_legs: 2, max_legs: 4, allow_probable: true}
  throw_ins:   {min_leg_prob: 0.55, count: 12, min_edge: 0.0, min_total: 2.5, max_total: 12, min_legs: 2, max_legs: 4, allow_probable: true}
  players:     {min_leg_prob: 0.55, count: 15, min_edge: 0.0, min_total: 2.5, max_total: 12, min_legs: 2, max_legs: 4, allow_probable: false}
  combo:       {min_leg_prob: 0.58, min_total: 4, max_total: 8, min_legs: 2, max_legs: 4, min_families: 2}

# ---------- Ταμείο (εμφανίζεται στο dashboard) ----------
bankroll:
  weekly: 20.0
  unit: 2.0
  max_bets_per_day: 2
  stop_at: 10.0
  lottery_stake: 1.0

# ---------- Παράδοση ----------
email:
