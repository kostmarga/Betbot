# ==========================================================
#  BetBot – ρυθμίσεις
#  Άλλαξε τιμές εδώ. Δεν χρειάζεται να πειράξεις κώδικα.
# ==========================================================

timezone: Europe/Athens
database: data/betbot.sqlite
reports_dir: docs            # εδώ γράφεται το index.html (GitHub Pages)

# ---------- Δελτίο ----------
slip:
  single_day: true         # κάθε δελτίο μόνο με αγώνες της ΙΔΙΑΣ «ημέρας στοιχημάτων» (06:00–05:59 ώρα Ελλάδας)· false = παλιά συμπεριφορά (hours_ahead)
  target_odds: 20.0          # στόχος συνολικής απόδοσης
  min_total_odds: 17.0       # αποδεκτό εύρος γύρω από τον στόχο
  max_total_odds: 25.0
  min_legs: 4
  max_legs: 8
  alternatives: 2            # πόσα εναλλακτικά δελτία εκτός από το κύριο
  stake: 2.0                 # ποντάρισμα ανά δελτίο (μόνο για το ιστορικό Κ/Ζ)
  hours_ahead: 30            # αγώνες που ξεκινούν μέσα στις επόμενες Χ ώρες
  extra_max_p_drop: 0.05     # το επιπλέον δελτίο βγαίνει ΜΟΝΟ αν η πιθανότητά του ≥ πιθανότητα κύριου − 0.05 (18/11/2026)
  exclusive_categories: true  # ΚΑΘΕ αγώνας μόνο σε ΜΙΑ κατηγορία δελτίων (οι άλλες κατηγορίες παίρνουν άλλους αγώνες)· false = μόνο το όριο ανά αγώνα (22/11/2026)
  exclusive_fallback: true     # ΜΟΝΟ αν για μια κατηγορία δεν υπάρχουν άλλοι αγώνες: ξαναχρησιμοποιούνται οι κορυφαίοι αγώνες άλλων κατηγοριών (αίτημα χρήστη 22/11/2026)
  fallback_max_slips_per_match: 4   # στην εφεδρική λειτουργία: το πολύ τόσα δελτία συνολικά ανά αγώνα (όλες οι κατηγορίες)
  max_slips_per_match: 2     # ΚΑΘΕ αγώνας σε το πολύ 2 δελτία της ημέρας (όλες οι κατηγορίες/επίπεδα) — 0 = χωρίς όριο (19/11/2026)
  extra_total_per_day: 3     # ΣΥΝΟΛΙΚΟ όριο επιπλέον δελτίων ανά ημέρα (όλες οι κατηγορίες και τα επίπεδα)
  extra_per_day: 2           # «Επιπλέον δελτίο» ανά κατηγορία/επίπεδο αν βγει αργότερα μέσα στην ημέρα (0 = κλειστό)

# ---------- Φίλτρα επιλογών ----------
selection:
  min_model_prob: 0.60       # ελάχιστη πιθανότητα (μετά το blend με την αγορά)
  min_edge: -0.10            # ελάχιστο value: p*απόδοση - 1. Με πιθανότητες από την αγορά το value = −προμήθεια (~−3…−7%), γι' αυτό −0.10
  min_odds: 1.15             # κάτω από αυτό δεν αξίζει ούτε για δέσιμο
  max_odds: 2.10             # (παλιό, για συμβατότητα)
  max_odds_any: 3.00         # μέγιστη απόδοση μίας επιλογής (backtest: οι υψηλές αποδόσεις χάνουν πολύ περισσότερο· 6+ ≈ −21%)
  fair_min_prob: 0.60        # επιλογές ΧΩΡΙΣ απόδοση: ελάχιστη πιθανότητα για να εμφανιστούν
  fair_min_odds: 1.30        # ... και δίκαιη απόδοση τουλάχιστον 1.30 (αλλιώς δεν αξίζει: π.χ. «Under 12.5 κόρνερ»)
  fair_value_margin: 0.05    # «παίξ' το αν ≥» = δίκαιη απόδοση × 1.05
  market_blend: 0.0          # 0 = μόνο αγορά, 1 = μόνο μοντέλο. Μπάσκετ: δεν έχει backtest, αλλά το μοντέλο ποδοσφαίρου έχασε από την αγορά και με τα πάντα βάρη -> ίδια προσοχή
  market_blend_football: 0.0 # ποδόσφαιρο: backtest 13 μηνών -> όσο περισσότερο βάρος στο μοντέλο, τόσο χειρότερα
  avoid:                     # επιλογές που έχασαν σταθερά και στις δύο μισές του backtest
    - {sport: football, market: OU, selection: UNDER}   # ΟΛΕΣ οι γραμμές Under (2.5/3.5/4.5…). Backtest 21.855 αγώνων: Under 2.5 ROI −6…−14% σε ΚΑΘΕ κλίμακα πιθανότητας (Over: ~−1%). Οι άλλες γραμμές δεν έχουν δικό τους backtest· τις αποκλείουμε προληπτικά
  max_legs_per_league: 3     # διασπορά κινδύνου
  min_team_matches: 8        # ομάδα με λιγότερα ματς στο ιστορικό -> αγνοείται

# ---------- Μοντέλα ----------
models:
  football:
    history_days: 540        # πόσο πίσω στο ιστορικό
    half_life_days: 180      # πόσο γρήγορα «ξεχνάει» παλιά ματς
    dc_rho: -0.08            # διόρθωση Dixon-Coles για 0-0 / 1-1
    h2h_weight_max: 0.15     # μέγιστη επιρροή αναμετρήσεων μεταξύ τους
    markets: [1X2, OU15, OU25, OU35, BTTS]
  basketball:
    history_days: 400
    half_life_days: 90
    markets: [ML, TOTAL, SPREAD]
  nfl:                       # NFL (16/11/2026): ίδιο μοντέλο με μπάσκετ· οι πιθανότητες έρχονται από την αγορά (market_blend 0)
    history_days: 800
    half_life_days: 120
    markets: [ML, TOTAL, SPREAD]
  counts:                    # κόρνερ / κάρτες / πλάγια
    history_days: 400
    half_life_days: 120
    p_shrink: {corners: 0.93, cards: 1.0}   # backtest 17/11/2026 (64.189 προβλέψεις): τα κόρνερ με p≥0.70 βγαίνουν ~2 μονάδες λιγότερο από το μοντέλο· κάρτες καλά βαθμονομημένες
    shrink_games: 16         # πόσο «τραβάμε» προς τον μέσο όρο ομάδες με λίγα ματς (backtest 06/11/2026: 4 → 16 βελτιώνει κάρτες 0.0154→0.0206 και κόρνερ 0.0005→0.0065)
    referee_shrink_games: 24
  players:
    player_last_n: 10        # τελευταία Ν ματς παίκτη
    player_min_games: 5

# ---------- Διοργανώσεις ----------
# espn: κωδικός ESPN · fdco: κωδικός football-data.co.uk · odds_api: κλειδί The Odds API
# sofascore: id διοργάνωσης στο Sofascore (uniqueTournament). Αν κάποιο είναι λάθος, ο collector
#            ταιριάζει και με το όνομα της διοργάνωσης (βλ. README §6).
leagues:
  - {id: EPL, oddspapi: 17,  name: Premier League,    sport: football,   espn: eng.1, fdco: E0,  sofascore: 17,  odds_api: soccer_epl}
  - {id: LIGA, oddspapi: 8, name: LaLiga,            sport: football,   espn: esp.1, fdco: SP1, sofascore: 8,   odds_api: soccer_spain_la_liga}
  - {id: SA, oddspapi: 23,   name: Serie A,           sport: football,   espn: ita.1, fdco: I1,  sofascore: 23,  odds_api: soccer_italy_serie_a}
  - {id: BL, oddspapi: 35,   name: Bundesliga,        sport: football,   espn: ger.1, fdco: D1,  sofascore: 35,  odds_api: soccer_germany_bundesliga}
  - {id: L1, oddspapi: 34,   name: Ligue 1,           sport: football,   espn: fra.1, fdco: F1,  sofascore: 34,  odds_api: soccer_france_ligue_one}
  - {id: GSL, oddspapi: 185,  name: Super League,      sport: football,   espn: gre.1, fdco: G1,  sofascore: 185, odds_api: soccer_greece_super_league}
  # Επιπλέον λίγκες (06/11/2026) – έχουν ESPN (αγώνες/κόρνερ/κάρτες) + football-data (αποδόσεις στο fixtures.csv)
  - {id: EFL1, oddspapi: 18, name: Championship,      sport: football,   espn: eng.2, fdco: E1,  odds_api: soccer_efl_champ}
  - {id: EFL2, oddspapi: 24, name: League One,        sport: football,   espn: eng.3, fdco: E2,  odds_api: soccer_england_league1}
  - {id: EFL3, oddspapi: 25, name: League Two,        sport: football,   espn: eng.4, fdco: E3,  odds_api: soccer_england_league2}
  - {id: SCO,  name: Scottish Premiership, sport: football, espn: sco.1, fdco: SC0, odds_api: soccer_spl}
  - {id: BEL,  name: Jupiler Pro League, sport: football,  espn: bel.1, fdco: B1,  odds_api: soccer_belgium_first_div}
  - {id: NED, oddspapi: 37,  name: Eredivisie,        sport: football,   espn: ned.1, fdco: N1,  odds_api: soccer_netherlands_eredivisie}
  - {id: POR,  name: Primeira Liga,     sport: football,   espn: por.1, fdco: P1,  odds_api: soccer_portugal_primeira_liga}
  - {id: TUR, oddspapi: 52,  name: Süper Lig,         sport: football,   espn: tur.1, fdco: T1,  odds_api: soccer_turkey_super_league}
  - {id: LIGA2, oddspapi: 54, name: LaLiga 2,         sport: football,   espn: esp.2, fdco: SP2, odds_api: soccer_spain_segunda_division}
  - {id: SB,   name: Serie B,           sport: football,   espn: ita.2, fdco: I2,  odds_api: soccer_italy_serie_b}
  - {id: BL2,  name: 2. Bundesliga,     sport: football,   espn: ger.2, fdco: D2,  odds_api: soccer_germany_bundesliga2}
  - {id: L2,   name: Ligue 2,           sport: football,   espn: fra.2, fdco: F2,  odds_api: soccer_france_ligue_two}
  - {id: UCL,  name: UEFA Champions League,  sport: football, espn: uefa.champions,   sofascore: 7,     odds_api: soccer_uefa_champs_league}
  - {id: UEL,  name: UEFA Europa League,      sport: football, espn: uefa.europa,      sofascore: 679,   odds_api: soccer_uefa_europa_league}
  - {id: UECL, name: UEFA Conference League,  sport: football, espn: uefa.europa.conf, sofascore: 17015, odds_api: soccer_uefa_europa_conference_league}
  # --- επιπλέον πρωταθλήματα (ESPN για προγράμματα/αποτελέσματα/αποδόσεις, fdco_new μόνο για backtest 1Χ2) ---
  # Backtest 09/11/2026: κρατήθηκαν όσα έχουν ROI ≥ των κύριων λιγκών. ΕΞΩ: Αυστρία, Ελβετία, Δανία, Αργεντινή, Ιρλανδία (αρνητικό ROI) και MLS (hit-rate 63% < 65% των κύριων λιγκών). Κριτήριο: ΔΕΝ πέφτει το hit-rate.
  - {id: NOR,  name: Eliteserien,         sport: football, espn: nor.1, fdco_new: NOR}
  - {id: SWE,  name: Allsvenskan,         sport: football, espn: swe.1, fdco_new: SWE}
  - {id: BRA,  name: Brasileirão,         sport: football, espn: bra.1, fdco_new: BRA}
  - {id: MEX,  name: Liga MX,             sport: football, espn: mex.1, fdco_new: MEX}
  - {id: JPN,  name: J1 League,           sport: football, espn: jpn.1, fdco_new: JPN}
  - {id: NBA, oddspapi: 132,  name: NBA,               sport: basketball, espn: nba,              odds_api: basketball_nba}
  - {id: EL, oddspapi: 138,   name: Euroleague,        sport: basketball, euroleague: E,          odds_api: basketball_euroleague}
  - {id: NFL, oddspapi: 31,  name: NFL,               sport: nfl,        espn: nfl}   # ΜΟΝΟ ML/spread/totals από ESPN (DraftKings)· backtest: docs/nfl_backtest.txt
  - {id: GBL,  name: ΕΚΟ Basket League, sport: basketball, greek_site: true}   # μόνο μέσω ελληνικού site (βλ. README)

# ---------- Πηγές (collectors / agents) ----------
collectors:
  espn:            {enabled: true}
  euroleague:      {enabled: true}
  fdco_history:    {enabled: true, seasons_back: 8}   # ιστορικά κόρνερ/κάρτες/φάουλ από προηγούμενες σεζόν
  espn_odds:       {enabled: true, days_ahead: 3, max_calls_per_run: 250}   # δωρεάν αποδόσεις (DraftKings/Bet365) από το ESPN
  fdco_odds:       {enabled: true}      # δωρεάν αποδόσεις top-5 + Super League
  oddspapi:        {enabled: true, bookmaker: stoiximan, hours_ahead: 36, max_calls_per_run: 8, reserve: 3, max_leagues: 12, warn_below: 40, no_pinnacle: [EL]}   # κόρνερ/κάρτες με απόδοση Stoiximan· ΟΡΙΟ 250 κλήσεις/μήνα (ανανέωση 1η)· env ODDSPAPI_KEY
  odds_api:
    enabled: true                       # χρειάζεται env ODDS_API_KEY (δωρεάν)
    regions: eu
    markets: [h2h, totals]
    monthly_budget: 497                 # αποθεματικό 3 credits ανά λογαριασμό: τρώμε όλα τα credits του 1ου και μετά περνάμε στον 2ο (απόφαση χρήστη 17/11/2026)
    warn_below: 60                      # κίτρινη προειδοποίηση στη σελίδα όταν τα συνολικά credits ≤ 60
    skip_if_fdco_covers: false          # ΑΝΟΙΧΤΟ (απόφαση χρήστη 17/11/2026): πολλά πρακτορεία = καλύτερη συναίνεση και καλύτερη τιμή και για τις λίγκες του fdco
  sofascore:
    enabled: true                       # πλάγια, κόρνερ, κάρτες, παίκτες, ενδεκάδες, απουσίες, αρχικές αποδόσεις
    backfill_days: 60                   # πρώτη εκτέλεση: πόσες μέρες ιστορικό (~1 ώρα)
    daily_lookback_days: 3              # επόμενες εκτελέσεις: μόνο οι τελευταίες μέρες
    max_calls_per_run: 2500             # ασφάλεια: μέγιστες κλήσεις ανά εκτέλεση
  espn_lineups:
    enabled: true                       # ενδεκάδες από το ESPN (~1 ώρα πριν τον αγώνα) + διαιτητής όπου υπάρχει
    window_hours: 3
    max_calls_per_run: 40
  espn_standings:
    enabled: true                       # βαθμολογία διοργανώσεων από το ESPN (για το «γιατί»)
    hours_ahead: 36
  espn_injuries:
    enabled: true                       # τραυματισμοί NBA από το ESPN (στο «γιατί»)
    hours_ahead: 36
  fpl:
    enabled: true                       # τραυματισμοί/στατιστικά παικτών Premier League (επίσημο Fantasy API, δωρεάν)
    hours_ahead: 36
  espn_news:
    enabled: true                       # ειδήσεις τραυματισμών από το feed του ESPN (στο «γιατί»)
    hours_ahead: 48
  espn_stats:
    enabled: true                       # εφεδρικά στατιστικά (κόρνερ/κάρτες/σουτ) αν το Sofascore μπλοκάρει
    lookback_days: 120
    max_calls_per_run: 400
  history_backfill:
    enabled: true                       # παλιό ιστορικό NBA/NFL για H2H/φόρμα στο «γιατί» (τελευταίοι 10)· σταδιακά, κάθε ομάδα×σεζόν μία φορά
    max_calls_per_run: 40
    nba_seasons: [2021, 2022, 2023, 2024, 2025]
    nfl_seasons: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  nba_box:
    enabled: true                       # boxscore NBA από το ESPN (πόντοι ανά παίκτη) για την κρίση των δελτίων «Πόντοι NBA»
    lookback_days: 5
    max_calls_per_run: 20
  greek_site:
    enabled: false                      # ενεργοποιείται αφού ρυθμιστεί (βλ. README §7)
    name: ""
    events_url: ""
    timeout: 20

notify:
  enabled: true                 # ειδοποίηση push (ntfy.sh) όταν βγαίνει ΝΕΟ δελτίο· χρειάζεται το secret NTFY_TOPIC, αλλιώς δεν στέλνεται τίποτα
  categories: [recommended, safe, overs]    # ποιες κατηγορίες ειδοποιούν (π.χ. + btts, x10, x30, x100, nba_pts)
  tiers: [strong, balanced, bold]

ui:
  default_tier: strong        # ποιο επίπεδο ρίσκου ανοίγει πρώτο στις καρτέλες δελτίων: strong = «Υψηλή πιθανότητα», balanced = «Μέση», bold = «Χαμηλή»

# ---------- Σκιώδη ταμεία (18/11/2026): πειραματικοί κανόνες, ΜΟΝΟ στο παρασκήνιο με εικονικά 2€ (list_name shadow_<όνομα>, δεν εμφανίζονται στη σελίδα)
# Έλεγχος: python tools/shadow_check.py <βάση>. Στόχος: να δούμε με νούμερα αν κάποιος κανόνας πάει καλύτερα από το κανονικό Προτεινόμενο.
shadow:
  value:      # «δίκαιη τιμή»: μόνο σκέλη όπου η καλύτερη τιμή που βρήκαμε ≥ δίκαιη τιμή (value ≥ 0)· σε πολλές μέρες δεν θα βγει δελτίο, και αυτό είναι το ζητούμενο
    base: recommended
    selection: {min_edge: 0.0}
  top2:       # «πιο δυνατά παιχνίδια»: μέχρι 2 σκέλη, πιθανότητα σκέλους ≥ 70%
    base: recommended
    lists:
      recommended: {min_leg_prob: 0.70, min_total: 1.50, max_total: 2.20, min_legs: 2, max_legs: 2}

# ---------- Κανόνες (από τα λάθη μας – βλ. betbot/rules.py) ----------
rules:
  min_ppg_for_win: 1.3           # όχι «νίκη» σε ομάδα με < 1.3 βαθμούς/ματς στα 5 τελευταία
  min_basket_win_rate: 0.4       # μπάσκετ: όχι νίκη σε ομάδα με < 40% νίκες στα 5 τελευταία
  max_absences: 5                # ≥5 απουσίες -> όχι Over/GG/νίκη για αυτή την ομάδα στο Προτεινόμενο
  max_attack_absences: 3         # ή ≥3 απουσίες επιθετικών/μέσων
  basket_min_ml_odds_safe: 1.55  # γηπεδούχος μπάσκετ κάτω από 1.55 δεν θεωρείται «safe»
  max_drift_against: 0.08        # απόδοση που ανέβηκε ≥8% -> έξω από Προτεινόμενο/Safe
  move_show_min: 0.04            # στην καρτέλα Κινήσεις: από 4% και πάνω

# ---------- Βαθμονόμηση πιθανοτήτων (backtest 09/11/2026: 15.910 αγώνες, 3 σεζόν, κλείσιμο Pinnacle) ----------
# Μέτρηση: πιθανότητα αγοράς -> πραγματική συχνότητα: 50-60%: +1.0 · 60-70%: +1.9 · 70-80%: +3.9 · 80+%: +2.6 · <30%: −0.5 (μονάδες).
# Εφαρμόζουμε το shrink (50%) της διόρθωσης μόνο στο 1Χ2 ποδοσφαίρου (για τα υπόλοιπα δεν έχουμε μέτρηση).
calibration:
  enabled: true
  shrink: 0.5
  football_1x2: [[0.0, 0.3, -0.005], [0.3, 0.5, 0.0], [0.5, 0.6, 0.010], [0.6, 0.7, 0.019], [0.7, 0.8, 0.039], [0.8, 1.01, 0.026]]

# ---------- Επίπεδα ρίσκου (paper trading: 20€/εβδομάδα ΑΝΑ κατηγορία ΚΑΙ ανά επίπεδο, βλ. betbot/paper.py) ----------
# balanced = οι τιμές των λιστών παρακάτω. strong/bold μετατοπίζουν το min_leg_prob και αλλάζουν το εύρος απόδοσης.
tiers:
  strong:   {leg_prob_delta: 0.10, recommended: {min_total: 1.85, max_total: 2.20, max_leg_odds: 1.60},
             safe: {min_total: 1.85, max_total: 2.20}}
  balanced: {}
  bold:     {leg_prob_delta: -0.05, recommended: {min_total: 2.60, max_total: 4.50, max_leg_odds: 2.40}}
paper:
  weekly: 20               # € ανά ταμείο (κατηγορία × επίπεδο) ανά εβδομάδα
  unit: 2                  # € ανά δελτίο (x30/x100: 1€)
  min_settled: 30          # κρίση ΜΟΝΟ μετά από τόσα δελτία που κρίθηκαν

# ---------- Λίστες / dashboards ----------
lists:
  # Προτεινόμενο = δελτίο που ΑΞΙΖΕΙ να παίξεις: συνολική απόδοση ~2.0–3.2 (όχι 1.47: με 2€ κερδίζεις 0.94€ και δεν αξίζει),
  # με όσο το δυνατόν μεγαλύτερη πιθανότητα μέσα σε αυτό το εύρος. Αντιστάθμισμα: πιθανότητα ~40–50% (όχι 63%).
  # Η αναμενόμενη ζημιά ανά 1€ είναι παρόμοια (~−3…−8%) – η υψηλότερη απόδοση δεν κάνει το στοίχημα πιο κερδοφόρο.
  recommended: {min_total: 1.85, max_total: 2.30, min_legs: 2, max_legs: 3, min_leg_prob: 0.65,
                max_leg_odds: 1.90, max_basketball_legs: 1, max_basketball_legs_thin: 2, thin_football_matches: 4, single_min_odds: 1.60, single_max_odds: 2.30,
                single_min_prob: 0.65}
  safe:        {count: 10, min_odds: 1.12, min_leg_prob: 0.75, min_total: 1.85, max_total: 2.30, min_legs: 2, max_legs: 4,
                max_basketball_legs: 1}     # Safe ΔΕΛΤΙΟ (ο χρήστης παίζει μόνο δελτία)
  x10:         {min_leg_prob: 0.65, min_total: 9,   max_total: 14,  min_legs: 3, max_legs: 6, max_basketball_legs: 2}
  x30:         {min_leg_prob: 0.63, min_total: 28,  max_total: 45,  min_legs: 4, max_legs: 8}
  x100:        {min_leg_prob: 0.60, min_total: 100, max_total: 250, min_legs: 5, max_legs: 10}
  overs:       {min_leg_prob: 0.62, count: 12, only_over: true, min_total: 8, max_total: 25, min_legs: 3, max_legs: 7}
