# Μάθηση από τα αποτελέσματά μας (betbot/learn.py)
learn:
  enabled: true
  prior_n: 40          # ισχυρή συρρίκνωση: λίγα δεδομένα → μικρή διόρθωση
  min_n: 20            # ελάχιστα κριθέντα σκέλη ανά χαρακτηριστικό
  min_abs_z: 1.0       # ελάχιστη στατιστική απόκλιση για να εφαρμοστεί διόρθωση
  max_down: 0.08       # μέγιστη μείωση πιθανότητας (8 μονάδες)
  max_up: 0.04         # μέγιστη αύξηση (4 μονάδες) — και με μισό βάρος
  up_weight: 0.5
  combine: 0.6         # τα χαρακτηριστικά επικαλύπτονται, δεν αθροίζονται 1:1
  weak_n: 20           # «αδύναμη αγορά»: ≥20 σκέλη, z ≤ −1.5 και ROI ως μονό ≤ −12% → εκτός Προτεινόμενου/Safe (27/11/2026: Over γκολ, Χάντικαπ)
  weak_z: -1.5
  weak_roi: -0.12
  weak_exception_p: 0.82     # εξαίρεση: σκέλος «αδύναμης» αγοράς (π.χ. Over) μπαίνει σε Προτεινόμενο/Safe ΜΟΝΟ αν p ≥ 82%, με βάση Pinnacle και edge ≥ −5%
  weak_exception_edge: -0.05

# Συσχέτιση σκελών μέσα στο δελτίο (εκτίμηση από ιστορικό: ίδια λίγκα ≈0.08, ίδιος τύπος αγοράς ≈0.02)
correlation:
  enabled: true
  same_league: 0.06
  same_group: 0.03
  global: 0.0

# Αναζήτηση αξίας (σκιώδες πείραμα, μονά στοιχήματα): τιμή Stoiximan > δίκαιη τιμή Pinnacle
value_scan:
  enabled: true
  min_edge: 0.02       # τιμή_stx × p_pinnacle − 1
  min_p: 0.20          # όχι μεγάλες αποδόσεις (θορυβώδες edge)
  max_p: 0.90
  max_odds: 6.0
  max_per_day: 6
